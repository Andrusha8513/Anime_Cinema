version: '3.8'

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:

services:

  postgres:
    image: postgres:15-alpine
    container_name: postgres_anime_auth-service-quarkus
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: GFGF18101961
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: [ "postgres", "-c", "wal_level=logical" ]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_anime_auth-service_quarkus
    restart: always
    ports:
      - "5052:81"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend
    depends_on:
      - postgres


  redis:
    image: redis:alpine
    container_name: auth_redis
    restart: always
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis_api_auth
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      - redis
    networks:
      - backend