quarkus:
  application:
    name: chat-service
  http:
    cors:
      enabled: true
      origins: /.*/        # dev-режим: любой origin. На проде сука  конкретный список!
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: Authorization,Content-Type
    host: 0.0.0.0
    port: 8888
  log:
    level: INFO
    category:
      "ara.chat":
        level: DEBUG
      "com.datastax.oss.driver":
        level: WARN
  smallrye-health:
    root-path: /q/health

kafka:
  bootstrap:
    servers: localhost:9092

scylla:
  contact-points: localhost:9042
  local-datacenter: datacenter1
  keyspace: chat

app:
  chat:
    default-page-size: 50
  jwt:
    access:
      public-key-location: keys/auth_public_key.pem
      issuer: auth-service-quarkus
  registration:
    audience: chat-service
    issuer: auth-service-quarkus
    public-key-location: keys/auth_public_key.pem


mp:
  messaging:
    incoming:
      user-events:
        connector: smallrye-kafka
        topic: USER
        group:
          id: chat-service-group
        auto:
          offset:
            reset: earliest
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        enable:
          auto:
            commit: false