<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat</title>
    <style>
        body { font-family: system-ui; margin: 0; padding: 12px; background: #f5f5f5; }
        .screen { display: none; } .screen.active { display: block; }
        input, button { font-size: 16px; padding: 10px; margin: 4px 0; width: 100%; box-sizing: border-box; }
        button { background: #0088cc; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        button.sec { background: #888; }
        #msgs { height: 45vh; overflow-y: auto; background: #fff; padding: 8px; border-radius: 6px; }
        .m { padding: 6px 10px; margin: 4px 0; border-radius: 10px; background: #eee; max-width: 80%; }
        .m.mine { background: #d3f0ff; margin-left: auto; }
        .m small { color: #777; font-size: 11px; display: block; }
        .conv { padding: 12px; background: #fff; margin: 4px 0; border-radius: 6px; cursor: pointer; }
        #log, #log2 { font-size: 11px; color: #666; white-space: pre-wrap; max-height: 100px; overflow-y: auto; }
        #wsstat { padding: 6px; border-radius: 4px; font-size: 12px; margin-bottom: 6px; }
        .ok { background: #d4f8d4; } .bad { background: #f8d4d4; }
        #wslog { font-size: 10px; color: #555; background: #fff; padding: 6px;
            max-height: 120px; overflow-y: auto; white-space: pre-wrap; border-radius: 4px; margin-top: 6px; }
    </style>
</head>
<body>

<!-- 1. Вход/регистрация -->
<div id="s-auth" class="screen active">
    <h3>Вход</h3>
    <input id="l-email" placeholder="email" autocomplete="off">
    <input id="l-pass" type="password" placeholder="пароль">
    <button onclick="doLogin()">Войти</button>
    <hr>
    <h3>Регистрация</h3>
    <input id="r-username" placeholder="username" autocomplete="off">
    <input id="r-email" placeholder="email" autocomplete="off">
    <input id="r-pass" type="password" placeholder="пароль (мин. 8)">
    <button onclick="doRegister()">Зарегистрироваться</button>
    <div id="log"></div>
</div>

<!-- 2. Код из письма -->
<div id="s-code" class="screen">
    <h3>Код из письма</h3>
    <input id="code" placeholder="6 цифр" inputmode="numeric">
    <button onclick="doConfirm()">Подтвердить</button>
    <div id="log2"></div>
</div>

<!-- 3. Список чатов -->
<div id="s-list" class="screen">
    <div id="wsstat" class="bad">WS: не подключён</div>
    <h3>Чаты <button class="sec" style="width:auto;float:right" onclick="logout()">Выйти</button></h3>
    <input id="target" placeholder="username собеседника">
    <button onclick="startDirect()">Написать</button>
    <div id="convs"></div>
    <div id="wslog"></div>
</div>

<!-- 4. Переписка -->
<div id="s-chat" class="screen">
    <button class="sec" style="width:auto" onclick="show('s-list')">← Назад</button>
    <h4 id="chat-title"></h4>
    <div id="msgs"></div>
    <div style="display:flex; gap:6px">
        <input id="text" placeholder="сообщение" onkeydown="if(event.key==='Enter')send()">
        <button style="width:80px" onclick="send()">→</button>
    </div>
    <div id="wslog2" style="font-size:10px;color:#555;background:#fff;padding:6px;max-height:100px;overflow-y:auto;white-space:pre-wrap;border-radius:4px;margin-top:6px"></div>
</div>

<script>
    const H = location.hostname;
    const USER = `http://${H}:9999`;
    const AUTH = `http://${H}:5555`;
    const CHAT = `http://${H}:8888`;
    const WSURL = `ws://${H}:8888/ws/chat`;

    let token = localStorage.getItem('token');
    let myId = null, ws = null, convId = null;

    const $ = id => document.getElementById(id);
    const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); };
    const log = (m, el='log') => { $(el).textContent += m + "\n"; };

    // лог сокета — виден на обоих экранах, чтобы не лезть в консоль
    function wslog(s) {
        const t = new Date().toLocaleTimeString() + "  " + s + "\n";
        ['wslog','wslog2'].forEach(id => {
            const el = $(id);
            if (el) { el.textContent += t; el.scrollTop = el.scrollHeight; }
        });
        console.log('[WS]', s);
    }
    function wsStat(text, ok) {
        const el = $('wsstat');
        el.textContent = 'WS: ' + text;
        el.className = ok ? 'ok' : 'bad';
    }

    // ---- регистрация ----
    let pendingPassword = null;

    async function doRegister() {
        const body = { username: $('r-username').value, email: $('r-email').value, password: $('r-pass').value };
        pendingPassword = body.password;
        const r = await fetch(`${USER}/api/user/registration`, {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
        });
        if (!r.ok) { log("Ошибка: " + await r.text()); return; }
        log("Код отправлен на почту");
        show('s-code');
    }

    async function doConfirm() {
        const r1 = await fetch(`${USER}/api/user/confirm-email`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ code: $('code').value })
        });
        if (!r1.ok) { log("Код неверен: " + await r1.text(), 'log2'); return; }
        const { token: regToken } = await r1.json();
        log("Email подтверждён, иду в auth-service...", 'log2');

        const r2 = await fetch(`${AUTH}/auth/complete-registration`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ token: regToken, password: pendingPassword })
        });
        if (!r2.ok) { log("auth-service: " + await r2.text(), 'log2'); return; }
        const data = await r2.json();
        saveToken(data.accessToken);
        pendingPassword = null;
        await openList();
    }

    async function doLogin() {
        const r = await fetch(`${AUTH}/auth/login`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ email: $('l-email').value, password: $('l-pass').value })
        });
        if (!r.ok) { log("Неверный email или пароль"); return; }
        const data = await r.json();
        saveToken(data.accessToken);
        await openList();
    }

    function saveToken(t) {
        token = t;
        localStorage.setItem('token', t);
        myId = JSON.parse(atob(t.split('.')[1])).sub;
    }

    function logout() {
        localStorage.removeItem('token'); token = null;
        if (ws) { ws.onclose = null; ws.close(); ws = null; }   // без авто-переподключения
        show('s-auth');
    }

    const auth = () => ({ 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' });

    // ---- чаты ----
    async function openList() {
        show('s-list');
        connectWs();
        const r = await fetch(`${CHAT}/chat/conversations`, { headers: auth() });
        if (r.status === 401) { logout(); return; }
        const convs = await r.json();
        $('convs').innerHTML = '';
        convs.forEach(c => {
            const d = document.createElement('div');
            d.className = 'conv';
            d.textContent = (c.title || 'Диалог') + '  [' + c.type + ']';
            d.onclick = () => openChat(c.conversationId, c.title || 'Диалог');
            $('convs').appendChild(d);
        });
    }

    async function startDirect() {
        const r = await fetch(`${CHAT}/chat/conversations/direct`, {
            method: 'POST', headers: auth(), body: JSON.stringify({ username: $('target').value })
        });
        if (!r.ok) { alert(await r.text()); return; }
        const c = await r.json();
        openChat(c.conversationId, $('target').value);
    }

    async function openChat(id, title) {
        convId = id;
        $('chat-title').textContent = title;
        $('msgs').innerHTML = '';
        show('s-chat');
        wslog('открыт чат ' + id);
        const r = await fetch(`${CHAT}/chat/messages/${id}?limit=50`, { headers: auth() });
        if (r.ok) (await r.json()).reverse().forEach(addMsg);
    }

    // ---- websocket ----
    function connectWs() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
        wsStat('подключаюсь...', false);
        ws = new WebSocket(WSURL);

        ws.onopen = () => {
            wslog('сокет открыт, шлю auth');
            wsStat('открыт, аутентификация...', false);
            ws.send(JSON.stringify({ type: 'auth', token: token }));
        };

        ws.onmessage = e => {
            wslog('<- ' + e.data);                       // ВИДНО ВСЁ, что шлёт сервер
            const m = JSON.parse(e.data);

            if (m.type === 'auth_ok') { wsStat('готов', true); return; }
            if (m.type === 'error')   { wsStat('ОШИБКА: ' + m.error, false); alert('WS: ' + m.error); return; }
            if (m.type === 'message') {
                if (m.conversationId === convId) addMsg(m);
                else wslog('сообщение из другого чата, пропускаю');
            }
        };

        ws.onerror = () => { wslog('!! ошибка сокета'); wsStat('ошибка', false); };
        ws.onclose = e => {
            wslog('сокет закрыт, code=' + e.code);
            wsStat('закрыт, переподключаюсь через 3с', false);
            setTimeout(connectWs, 3000);
        };
    }

    function send() {
        const content = $('text').value.trim();
        if (!content) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) { alert('Сокет не подключён'); return; }
        const payload = { type: 'message', conversationId: convId, content };
        ws.send(JSON.stringify(payload));
        wslog('-> ' + JSON.stringify(payload));
        $('text').value = '';
    }

    function addMsg(m) {
        const d = document.createElement('div');
        d.className = 'm' + (m.senderId === myId ? ' mine' : '');
        d.innerHTML = '<small>' + (m.senderId === myId ? 'я' : String(m.senderId).slice(0, 8)) + '</small>';
        d.appendChild(document.createTextNode(m.content));
        $('msgs').appendChild(d);
        $('msgs').scrollTop = $('msgs').scrollHeight;
    }

    if (token) { saveToken(token); openList(); }
</script>
</body>
</html>
