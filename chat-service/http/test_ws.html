<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Chat WS Test</title></head>
<body style="font-family: monospace">
<h3>Chat WebSocket тест</h3>

<div>
    <label>accessToken:</label><br>
    <textarea id="token" rows="4" cols="90" placeholder="вставь accessToken из login"></textarea><br>
    <button onclick="connect()">1. Подключиться + auth</button>
    <button onclick="disconnect()">Отключиться</button>
</div>

<div style="margin-top:15px">
    <label>conversationId:</label>
    <input id="conv" size="40" value="11111111-1111-1111-1111-111111111111"><br><br>
    <input id="msg" size="60" placeholder="текст сообщения">
    <button onclick="sendMsg()">2. Отправить</button>
</div>

<h4>Лог:</h4>
<pre id="log" style="background:#f0f0f0; padding:10px; height:300px; overflow:auto"></pre>

<script>
    let ws;
    function log(s) {
        const el = document.getElementById('log');
        el.textContent += new Date().toLocaleTimeString() + "  " + s + "\n";
        el.scrollTop = el.scrollHeight;
    }

    function connect() {
        const token = document.getElementById('token').value.trim();
        if (!token) { log("!! вставь токен"); return; }

        ws = new WebSocket("ws://localhost:8888/ws/chat");

        ws.onopen = () => {
            log("соединение открыто, отправляю auth...");
            ws.send(JSON.stringify({ type: "auth", token: token }));
        };
        ws.onmessage = e => log("<- " + e.data);
        ws.onerror = () => log("!! ошибка сокета (смотри логи chat-service)");
        ws.onclose = e => log("соединение закрыто (code=" + e.code + ")");
    }

    function disconnect() { if (ws) ws.close(); }

    function sendMsg() {
        if (!ws || ws.readyState !== WebSocket.OPEN) { log("!! сначала подключись"); return; }
        const payload = {
            type: "message",
            conversationId: document.getElementById('conv').value.trim(),
            content: document.getElementById('msg').value
        };
        ws.send(JSON.stringify(payload));
        log("-> " + JSON.stringify(payload));
        document.getElementById('msg').value = "";
    }
</script>
</body>
</html>
